[package]
name = "ffmpeg-utils"
version = "2.0.0"
description = "Convert, trim, edit tracks and extract media with FFmpeg"
authors = ["deyvvi"]
license = "MIT"
edition = "2024"

[lib]
name = "ffmpeg_utils_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread"] }
tokio-util = "0.7"
which = "8"
num-rational = "0.4"
uuid = { version = "1", features = ["v4"] }
dirs = "6"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
